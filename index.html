<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>권외 — 검색되지 않는 마을</title>
<meta name="description" content="가상 데스크톱에서 진행하는 검색·SNS 추리 어드벤처">
<style>
/* ============================================================
   권외 — 검색되지 않는 마을 : 스타일
   ============================================================ */
:root{
  --bg:#0d1420; --bg2:#152033; --panel:#f6f7f9; --ink:#1c2230; --ink2:#5b6475;
  --line:#d9dde5; --accent:#3b6df0; --accent2:#e0475b; --ok:#1f9d63; --warn:#d98a00;
  --win-shadow:0 18px 48px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --font:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",system-ui,sans-serif;
  --mono:"D2Coding","Nanum Gothic Coding","Consolas","Menlo",monospace;
  --taskbar:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--accent);cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--ink2)}
.small{font-size:12px}
.center{text-align:center}

/* ---------- 타이틀 ---------- */
#title{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%,#1b2a44 0%,#070b12 70%);color:#dfe6f3;overflow:auto}
#title .t-box{max-width:560px;width:100%;padding:32px 20px;text-align:center}
#title .t-signal{font-family:var(--mono);letter-spacing:.3em;color:#6f86ad;font-size:12px;margin-bottom:18px}
#title h1{font-size:44px;margin:0;letter-spacing:.08em;font-weight:800}
#title h1 small{display:block;font-size:17px;font-weight:400;letter-spacing:.25em;color:#9fb1cf;margin-top:10px}
#title .t-bars{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:28px;margin:26px 0 10px}
#title .t-bars i{display:block;width:7px;background:#33425e;border-radius:2px}
#title .t-bars i:nth-child(1){height:6px}#title .t-bars i:nth-child(2){height:12px}#title .t-bars i:nth-child(3){height:18px}#title .t-bars i:nth-child(4){height:24px}
#title .t-bars b{font-size:12px;color:#e0475b;margin-left:8px;font-family:var(--mono)}
#title .t-menu{display:flex;flex-direction:column;gap:10px;margin:28px auto 0;max-width:280px}
#title .t-menu button{padding:12px 16px;border:1px solid #3a4b6b;background:#121b2c;color:#e7edf8;border-radius:8px;font-size:15px;transition:.15s}
#title .t-menu button:hover{background:#1d2b46;border-color:#5f7bb0}
#title .t-menu button.danger{color:#ff9aa6;border-color:#5a2a33;background:#1a1016}
#title .t-note{margin-top:26px;font-size:12px;line-height:1.8;color:#8796b2;border-top:1px solid #222f47;padding-top:16px}
#title .t-note b{color:#c9d5ea}

/* ---------- 장 제목 카드 / 연출 오버레이 ---------- */
#overlay{position:fixed;inset:0;z-index:8000;display:flex;align-items:center;justify-content:center;background:rgba(3,6,12,.94);color:#e8edf6;opacity:0;pointer-events:none;transition:opacity .6s}
#overlay.on{opacity:1;pointer-events:auto}
#overlay .ov-in{max-width:640px;padding:28px 22px;text-align:center}
#overlay .ov-num,.ov-num{font-family:var(--mono);letter-spacing:.4em;color:#7f93b8;font-size:13px}
#overlay .ov-title{font-size:34px;font-weight:800;margin:14px 0 8px;letter-spacing:.05em}
#overlay .ov-sub{color:#a9b6cc;line-height:1.8;white-space:pre-line}
#overlay .ov-text{font-size:17px;line-height:2;white-space:pre-line;text-align:left}
#overlay .ov-text.center{text-align:center}
#overlay .ov-btn,.ov-btn{margin-top:28px;padding:10px 22px;border:1px solid #47587a;background:transparent;color:#dfe7f5;border-radius:6px}
#overlay .ov-btn:hover,.ov-btn:hover{background:#1c2943}
#overlay .ov-guilt{font-size:26px;font-weight:700;color:#ffb3bd;letter-spacing:.04em}

/* ---------- 데스크톱 ---------- */
#desktop{position:fixed;inset:0;bottom:var(--taskbar);overflow:hidden;
  background:linear-gradient(160deg,#122036 0%,#0b1220 55%,#0a0f19 100%)}
#desktop::before{content:"권외";position:absolute;right:6%;bottom:8%;font-size:16vw;font-weight:900;color:rgba(255,255,255,.025);letter-spacing:.1em;pointer-events:none}
#icons{position:absolute;left:10px;top:10px;bottom:10px;display:flex;flex-direction:column;flex-wrap:wrap;gap:4px;align-content:flex-start}
.icon{width:80px;padding:6px 4px;border-radius:8px;color:#e6ecf7;text-align:center;cursor:pointer;user-select:none;position:relative;border:1px solid transparent;background:none}
.icon:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1)}
.icon .ic{width:42px;height:42px;margin:0 auto 5px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.icon .lb{font-size:12px;line-height:1.3;text-shadow:0 1px 2px #000;word-break:keep-all}
.icon .badge{position:absolute;top:4px;right:14px;background:var(--accent2);color:#fff;font-size:10px;border-radius:9px;padding:1px 5px;font-weight:700}
.icon.new .ic{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,102,.7)}50%{box-shadow:0 0 0 8px rgba(255,214,102,0)}}

#sticky{position:absolute;right:30px;bottom:30px;width:200px;padding:14px 14px 18px;background:#fff3a6;color:#4a3d00;
  font-size:13px;line-height:1.6;transform:rotate(2.5deg);box-shadow:0 6px 14px rgba(0,0,0,.4);font-family:var(--font);cursor:default}
#sticky b{display:block;font-size:14px;margin-bottom:4px}
#sticky .pin{position:absolute;top:-6px;left:50%;width:12px;height:12px;border-radius:50%;background:#d33;box-shadow:0 2px 3px rgba(0,0,0,.4)}

/* ---------- 작업표시줄 ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskbar);background:rgba(10,14,22,.96);border-top:1px solid #253149;display:flex;align-items:center;gap:6px;padding:0 8px;z-index:7000;color:#dbe3f1}
#tb-start{width:34px;height:34px;border-radius:8px;border:0;background:#22314f;color:#fff;font-weight:800}
#tb-wins{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#tb-wins::-webkit-scrollbar{display:none}
.tb-btn{flex:0 0 auto;max-width:150px;height:32px;padding:0 10px;border-radius:6px;border:1px solid #2a3753;background:#141d2f;color:#d5ddea;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn.active{background:#26375a;border-color:#4a6597}
.tb-btn.min{opacity:.6}
#tb-tray{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
#tb-found{border:1px solid #33456a;background:#18233a;color:#cfe0ff;border-radius:6px;padding:5px 8px;font-size:12px}
#tb-found:hover{background:#22325a}
#tb-sound{border:0;background:none;color:#cfd8e8;font-size:16px;padding:4px}
#tb-clock{text-align:right;line-height:1.2;font-family:var(--mono);font-size:11px;color:#c8d2e2}

/* ---------- 토스트 ---------- */
#toasts{position:fixed;right:14px;top:14px;z-index:8500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{min-width:220px;max-width:320px;background:#162238;color:#eef3fb;border:1px solid #34486f;border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:tin .3s ease-out;pointer-events:auto}
.toast.star{border-left-color:#ffcc33}
.toast.good{border-left-color:var(--ok)}
.toast.bad{border-left-color:var(--accent2)}
.toast b{display:block;margin-bottom:2px}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

/* ---------- 창 ---------- */
.win{position:absolute;background:var(--panel);border-radius:10px;box-shadow:var(--win-shadow);display:flex;flex-direction:column;overflow:hidden;min-width:300px;min-height:200px;border:1px solid #9aa6bb}
.win.focus{border-color:#6f8fd6}
.win .wbar{height:36px;flex:0 0 36px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:linear-gradient(#eef1f6,#dfe4ec);border-bottom:1px solid #c7cdd8;cursor:move;user-select:none;touch-action:none}
.win.focus .wbar{background:linear-gradient(#e9efff,#d3ddf5)}
.win .wtitle{flex:1;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .wbtn{width:28px;height:24px;border:0;background:transparent;border-radius:5px;font-size:14px;color:#44506a}
.win .wbtn:hover{background:rgba(0,0,0,.08)}
.win .wbtn.close:hover{background:#e0475b;color:#fff}
.win .wbody{flex:1;overflow:auto;position:relative;background:#fff}
.win .wresize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.18) 50%)}
.win.min{display:none}

/* ---------- 공통 UI ---------- */
.pad{padding:14px 16px}
.btn{padding:7px 14px;border-radius:6px;border:1px solid #b9c2d3;background:#fff;color:var(--ink)}
.btn:hover{background:#f0f3f9}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{padding:8px 10px;border:1px solid #b9c2d3;border-radius:6px;background:#fff;color:var(--ink);min-width:0}
.inp:focus{outline:2px solid #9db6f3;border-color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;background:#f3f5f9;position:sticky;top:0;z-index:2}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.empty{padding:40px 16px;text-align:center;color:var(--ink2)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#e8edf7;color:#40507a;margin-right:4px}
.star-tag{background:#fff2c2;color:#8a6400}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- 사진 ---------- */
.photo{display:block;margin:12px 0;border:1px solid #c9ced8;background:#222;cursor:zoom-in;position:relative;max-width:520px}
.photo svg{display:block;width:100%;height:auto}
.photo figcaption{background:#f4f5f7;color:#3c4558;font-size:12px;padding:6px 8px;border-top:1px solid #d6dae2}
.photo .zoomhint{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.pv{display:flex;flex-direction:column;height:100%;background:#111}
.pv-tools{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#1d1f24;color:#ddd;font-size:12px}
.pv-tools button{background:#2c2f36;color:#eee;border:1px solid #444;border-radius:5px;padding:4px 10px}
.pv-stage{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.pv-stage svg{position:absolute;left:0;top:0;transform-origin:0 0}
.pv-cap{padding:6px 10px;background:#1d1f24;color:#cfd3da;font-size:12px}

/* ---------- 메아리 검색 ---------- */
.srch{min-height:100%;display:flex;flex-direction:column;background:#fff}
.srch-top{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfd;position:sticky;top:0;z-index:3;flex-wrap:wrap}
.srch-logo{font-weight:900;font-size:18px;letter-spacing:.02em;color:#2b4fc5;white-space:nowrap}
.srch-logo span{color:#e0475b}
.srch-form{flex:1;display:flex;gap:6px;min-width:200px}
.srch-form .inp{flex:1}
.srch-tabs{display:flex;gap:4px}
.srch-tabs button{border:1px solid #c9d1e0;background:#fff;border-radius:16px;padding:4px 12px;font-size:12px;color:#445}
.srch-tabs button.on{background:#2b4fc5;color:#fff;border-color:#2b4fc5}
.srch-home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center}
.srch-home .big{font-size:40px;font-weight:900;color:#2b4fc5;margin-bottom:6px}
.srch-home .big span{color:#e0475b}
.srch-res{padding:10px 16px 30px}
.srch-count{color:var(--ink2);font-size:13px;margin:6px 0 14px}
.srch-zero{text-align:center;padding:50px 10px}
.srch-zero .z{font-size:44px;font-weight:900;color:#2a3140;letter-spacing:.02em}
.srch-zero .z em{font-style:normal;color:#e0475b}
.srch-zero p{color:var(--ink2)}
.r-item{margin-bottom:18px;max-width:640px}
.r-item .r-url{font-size:12px;color:#1c7a45;word-break:break-all}
.r-item .r-title{font-size:16px;color:#1a3fb5;text-decoration:none;font-weight:700;cursor:pointer}
.r-item .r-title:hover{text-decoration:underline}
.r-item .r-snip{font-size:13px;color:#454c5a;margin-top:3px;line-height:1.55}
.r-item.dead .r-title{color:#7a7f8a;text-decoration:line-through}
.r-item.seen .r-title{color:#6b3fb5}
.suggest{margin-top:20px;font-size:14px;color:#445}
.suggest .blur{filter:blur(4px);cursor:pointer;transition:filter .3s;font-weight:700;color:#2b4fc5;user-select:none}
.suggest .blur.clear{filter:none}
.page-nav{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#f1f3f7;border-bottom:1px solid var(--line);font-size:12px;position:sticky;top:57px;z-index:2}
.page-nav .addr{flex:1;background:#fff;border:1px solid #cdd3de;border-radius:14px;padding:3px 10px;color:#3d4660;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 페이지 종류별 */
.pg{padding:18px 20px 40px;line-height:1.75;font-size:14px;max-width:760px}
.pg h1{font-size:22px;line-height:1.35;margin:4px 0 10px}
.pg h2{font-size:17px;margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.pg h3{font-size:15px;margin:16px 0 6px}
.pg p{margin:0 0 12px}
.pg table{border-collapse:collapse;margin:10px 0;font-size:13px}
.pg td,.pg th{border:1px solid #cfd5df;padding:5px 9px;text-align:left;vertical-align:top}
.pg th{background:#f1f4f8}
.pg blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid #c3cbe0;background:#f6f8fc;color:#3d465b}
.pg .meta{color:var(--ink2);font-size:12px;margin-bottom:12px}
.pg ul{padding-left:20px}
.pg .ilink{color:#1a3fb5;text-decoration:underline;cursor:pointer}
.pg-news{font-family:"Batang","AppleMyungjo","Noto Serif KR",serif}
.pg-news .paper{font-family:var(--font);font-weight:900;font-size:13px;letter-spacing:.2em;color:#9b1c2c;border-bottom:3px double #9b1c2c;padding-bottom:6px;margin-bottom:12px}
.pg-wiki .wk-head{font-size:12px;color:#556;border-bottom:1px solid #a2a9b1;padding-bottom:4px;margin-bottom:10px}
.pg-wiki h1{font-family:"Batang","AppleMyungjo",serif;font-weight:400;font-size:26px;border-bottom:1px solid #a2a9b1;padding-bottom:4px}
.pg-wiki .infobox{float:right;width:220px;margin:0 0 12px 14px;border:1px solid #a2a9b1;background:#f8f9fa;font-size:12px;padding:6px}
.pg-wiki .infobox td{border:0;padding:2px 4px}
.pg-blog09{background:#fff0f6;font-family:var(--font)}
.pg-blog09 .bh{background:linear-gradient(#ff9ec7,#ff7ab0);color:#fff;padding:12px;border-radius:6px;font-weight:800;text-shadow:0 1px 0 #c24d82}
.pg-blog09 .bh small{display:block;font-weight:400;font-size:11px}
.pg-blog09 .post{background:#fff;border:1px dashed #ff9ec7;border-radius:6px;padding:12px;margin-top:12px}
.pg-blog{font-family:var(--font)}
.pg-blog .bh{border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:14px;font-weight:800;font-size:18px}
.pg-blog .bh small{display:block;font-weight:400;font-size:12px;color:#777}
.pg-letter{background:#f4ecd8;font-family:"Batang","AppleMyungjo",serif;color:#3b3020;border:1px solid #d8c9a3;box-shadow:inset 0 0 40px rgba(120,90,30,.18);margin:14px;filter:sepia(.15)}
.pg-letter .nl-head{text-align:center;border-bottom:3px double #6b5a3a;padding-bottom:8px;margin-bottom:12px}
.pg-letter .nl-head b{font-size:24px;letter-spacing:.3em;display:block}
.pg-letter .nl-col{columns:2 240px;column-gap:24px;column-rule:1px solid #cdbb90}
.pg-letter .nl-box{border:1px solid #8a7550;padding:8px;margin:8px 0;break-inside:avoid}
.pg-shop{font-family:var(--font)}
.pg-shop .sh{background:#2d4a2a;color:#f3f0d8;padding:14px;font-size:20px;font-weight:800;border-radius:4px}
.pg-shop .sh small{display:block;font-size:12px;font-weight:400;opacity:.85}
.pg-matome .mt{background:#222;color:#ffde4d;padding:10px 12px;font-weight:900}
.pg-matome .res{margin:8px 0;padding:6px 0;border-bottom:1px dotted #ccc}
.pg-matome .res .rh{color:#2a7d2a;font-size:12px}
.pg-tool{font-family:var(--font)}
.arch-banner{background:#22252c;color:#e8d9a8;font-size:12px;padding:8px 12px;font-family:var(--mono);border-bottom:2px solid #c9a447}
.arch-banner b{color:#ffd76a}
.dead404{padding:60px 20px;text-align:center;color:#555}
.dead404 .n{font-size:60px;font-weight:900;color:#c9ced8}
.lockbox{border:2px dashed #b8c1d4;border-radius:8px;padding:18px;text-align:center;background:#f7f9fc;margin:16px 0}
.lockbox .inp{width:140px;text-align:center;letter-spacing:.2em}
.note-paper{background:#fffdf3;border:1px solid #e4dcc0;padding:16px 18px;font-family:"Nanum Pen Script","Comic Sans MS",var(--font);font-size:17px;line-height:1.9;box-shadow:2px 3px 8px rgba(0,0,0,.15);transform:rotate(-.6deg);max-width:440px;white-space:pre-line}

/* ---------- 메일(2026) ---------- */
.mail{display:flex;height:100%}
.mail-list{width:250px;flex:0 0 250px;border-right:1px solid var(--line);overflow:auto;background:#f7f8fb}
.mail-item{padding:10px 12px;border-bottom:1px solid #e4e7ee;cursor:pointer}
.mail-item:hover{background:#eef2fb}
.mail-item.on{background:#dfe8ff}
.mail-item.unread .mi-sub{font-weight:800}
.mail-item.unread::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}
.mi-from{font-size:12px;color:var(--ink2)}
.mi-sub{font-size:13px;margin-top:2px}
.mail-view{flex:1;overflow:auto;padding:16px 20px}
.mail-view h2{margin:0 0 10px;font-size:18px}
.mail-hdr{font-size:12px;color:#4b5468;background:#f3f5f9;border:1px solid var(--line);border-radius:6px;padding:8px 10px;line-height:1.7;font-family:var(--mono)}
.mail-body{white-space:pre-wrap;line-height:1.85;margin-top:14px}
.attach{display:inline-flex;align-items:center;gap:6px;border:1px solid #c9d1e0;border-radius:6px;padding:6px 10px;margin:6px 6px 0 0;background:#fff;cursor:pointer;font-size:13px}
.attach:hover{background:#eef3ff}

/* ---------- 기록부 ---------- */
.rec-rule{position:sticky;top:0;z-index:3;background:#1f2a40;color:#e9eef8;padding:10px 14px;font-size:12.5px;line-height:1.6}
.rec-rule b{color:#ffd76a}
.rec-prog{display:flex;align-items:center;gap:10px;margin-top:6px}
.rec-prog .bar{flex:1;height:6px;background:#33415e;border-radius:3px;overflow:hidden}
.rec-prog .bar i{display:block;height:100%;background:#ffd76a}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:14px}
.card{border:1px solid #cfd6e3;border-radius:10px;padding:12px;background:#fbfcfe;position:relative}
.card.locked{background:#eefaf3;border-color:#7cc8a0}
.card .c-label{font-size:11px;color:var(--ink2)}
.card .c-handle{font-size:16px;font-weight:800;margin:2px 0 8px}
.card .c-st{position:absolute;right:10px;top:10px;font-size:11px;padding:2px 8px;border-radius:10px;background:#e7ebf3;color:#556}
.card.locked .c-st{background:var(--ok);color:#fff}

(function(){

/* ---- 정규화 · 해시 · 잠금 해제 (빌드 스크립트와 엔진이 같은 코드를 공유) ---- */
function cyrb53(str, seed){
  seed = seed || 0;
  var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (var i = 0, ch; i < str.length; i++) {

    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);

  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);

/* 공백 제거, 소문자화, 주소 앞부분과 기호 제거 */
function norm(s){

  s = s.replace(/^https?:\/\//, '').replace(/^www\./, '');
  return s.replace(/[\s .,·:;'"`!?~\-_\/\\()\[\]{}<>◆#@|+*=]+/g, '');

function H(s){ return cyrb53('kengai|' + norm(s), 1729).toString(36); }
function HR(name, s, w, r){ return cyrb53('kengai-rec|' + norm(name) + '|' + s + '|' + w + '|' + r, 4242).toString(36); }
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

function parseRes(src){
  var out = [], date = '2009/08/15';
  String(src || '').split('\n').forEach(function(line){
    line = line.trim(); if (!line) return;
    if (line.charAt(0) === '@') { date = line.slice(1).trim(); return; }
    var bar = line.indexOf('|'); if (bar < 0) return;
    var head = line.slice(0, bar).trim(), body = line.slice(bar + 1).trim();
    var m = head.match(/^(\d\d:\d\d:\d\d)\s+(\S+)(.*)$/); if (!m) return;
    var rest = m[3], trip = '', name = '', flags = [];
    rest = rest.replace(/◆(\S+)/, function(_, t){ trip = t; return ''; });
    rest = rest.replace(/\[([^\]]+)\]/, function(_, n){ name = n; return ''; });
    rest.replace(/#(\w+)/g, function(_, f){ flags.push(f); return ''; });
    out.push({ no: out.length + 1, date: date, time: m[1], id: m[2], trip: trip, name: name, del: m[2] === 'DEL', flags: flags, body: body });
  });
  return out;
}
function prepVideo(v){
  var list = [], rnd = mulberry32(815);
  String(v.comments || '').split('\n').forEach(function(line){
    line = line.trim(); if (!line) return;
    var bar = line.indexOf('|'); if (bar < 0) return;
    var head = line.slice(0, bar).trim().split(/\s+/), text = line.slice(bar + 1).trim();
    var t = parseSec(head[0]); if (t == null) return;
    var u = head[1] || '-', color = '';
    var cm = text.match(/^\{(\w+)\}\s*/); if (cm) { color = cm[1]; text = text.slice(cm[0].length); }
    var del = false; if (text === '[삭제]') del = true;
    list.push({ t: t, u: u === '-' ? ('#' + (100000 + Math.floor(rnd() * 899999))) : u, text: text, color: color, del: del });
  });
  (v.filler || []).forEach(function(f){
    var a = parseSec(f.from), b = parseSec(f.to);
    for (var s = a; s < b; s++) {
      if (rnd() < f.dens) {
        list.push({ t: s + rnd(), u: '#' + (100000 + Math.floor(rnd() * 899999)), text: f.pool[Math.floor(rnd() * f.pool.length)], color: rnd() < .06 ? ['red','green','yellow'][Math.floor(rnd()*3)] : '', filler: true });
      }
    }
  });
  list.sort(function(x, y){ return x.t - y.t; });
  v._c = list;
  v._dur = parseSec(v.duration);
  (v.segments || []).forEach(function(sg){ sg._a = parseSec(sg.from); sg._b = parseSec(sg.to); });
  (v.events || []).forEach(function(ev){ ev._t = parseSec(ev.at); });
}

    (ch.threads || []).forEach(function(t){ t._ch = ci; t._res = parseRes(t.res); t._end = parseRes(t.endRes); IDX.threads[t.id] = t; IDX.threadList.push(t); });

function openPhoto(scene, cap){
  var W = openWin('photo', '사진 보기', 780, 560);
  W.body.innerHTML = '';
  var st = W.st = { z: 1, x: 0, y: 0 };
  var stage = h('div', { class:'pv-stage' });
  var label = h('span', null, '×1');
  function apply(){ var svg = stage.querySelector('svg'); if (svg) svg.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px) scale(' + st.z + ')'; label.textContent = '×' + st.z.toFixed(1).replace('.0', ''); }
  function zoom(f, cx, cy){
    var nz = Math.max(1, Math.min(8, st.z * f));
    if (cx == null) { cx = stage.clientWidth / 2; cy = stage.clientHeight / 2; }
    st.x = cx - (cx - st.x) * nz / st.z; st.y = cy - (cy - st.y) * nz / st.z; st.z = nz;
    if (st.z === 1) { st.x = 0; st.y = 0; } apply();
  }
  var tools = h('div', { class:'pv-tools' },
    h('button', { onclick:function(){ zoom(1/1.5); } }, '－ 축소'), h('button', { onclick:function(){ zoom(1.5); } }, '＋ 확대'),
    h('button', { onclick:function(){ st.z = 1; st.x = 0; st.y = 0; apply(); } }, '원래대로'), label,
    h('span', { class:'muted', style:'margin-left:auto;color:#999' }, '끌어서 이동 · 휠로 확대'));
  var capEl = h('div', { class:'pv-cap', html: cap || '' });
  W.body.appendChild(h('div', { class:'pv' }, tools, stage, capEl));
  stage.innerHTML = sceneSVG(scene);
  function fit(){ var svg = stage.querySelector('svg'); if (!svg) return; svg.setAttribute('width', stage.clientWidth); svg.removeAttribute('height'); svg.style.height = 'auto'; }
  setTimeout(function(){ fit(); apply(); }, 0);
  W.onresize = function(){ fit(); };
  var drag = null;
  stage.addEventListener('pointerdown', function(e){ drag = { x: e.clientX, y: e.clientY, ox: st.x, oy: st.y }; try { stage.setPointerCapture(e.pointerId); } catch (x) {} });
  stage.addEventListener('pointermove', function(e){ if (!drag) return; st.x = drag.ox + e.clientX - drag.x; st.y = drag.oy + e.clientY - drag.y; apply(); });
  stage.addEventListener('pointerup', function(){ drag = null; });
  stage.addEventListener('wheel', function(e){ e.preventDefault(); var r = stage.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.25 : 0.8, e.clientX - r.left, e.clientY - r.top); }, { passive:false });
}

function recCorrect(pid){
  var p = IDX.people[pid], r = S.rec[pid];
  if (!r || !r.n || r.s < 0 || r.w < 0 || r.r < 0) return false;
  return p.answers.indexOf(HR(r.n, r.s, r.w, r.r)) >= 0;
}
function recCheck(){
  var unconf = IDX.peopleList.filter(function(p){ return S.cards[p.id] && !S.conf[p.id]; });
  var correct = unconf.filter(function(p){ return recCorrect(p.id); });
  var remaining = IDX.peopleList.length - confCount();
  var batch = null;
  if (correct.length >= 3) batch = correct.slice(0, 3);
  else if (remaining > 0 && remaining < 3 && correct.length === remaining) batch = correct;
  if (!batch) return null;
  batch.forEach(function(p){ S.conf[p.id] = true; });
  var names = batch.map(function(p){ return p.handle; }).join(', ');
  toast('기록 확정', names + ' — ' + batch.length + '명이 「정리됨」으로 확정되었습니다.', 'good');
  sfx('unlock'); save();
  setTimeout(function(){ refreshWin('record'); }, 50);
  if (confCount() >= IDX.peopleList.length && S.chapter >= IDX.chapters.length - 1) { unlockApp('final'); }
  return batch.length + '명 확정!';
}

function renderCP(W){
  W.body.innerHTML = '';

    if (pc.checkpoint) box.appendChild(h('div', { class:'cp-past' }, '✔ ' + pc.num + ' 「' + pc.title + '」 — 정리 완료'));
  }

  box.appendChild(h('h3', null, ch.num + ' 「' + ch.title + '」'));
  if (!ch.checkpoint) {
    box.appendChild(h('p', { class:'muted', html: ch.cpNote || '' }));

  }
  box.appendChild(h('p', { class:'small muted' }, '빈칸을 채워 문장을 완성하세요. 틀리면 몇 칸이 맞았는지만 알려줍니다. 띄어쓰기와 대소문자는 상관없습니다.'));

    var sent = h('div', { class:'cp-sent' + (done ? ' done' : '') });
    var inputs = [];
    var bi = 0;
    sn.parts.forEach(function(pt){
      if (typeof pt === 'string') { sent.appendChild(document.createTextNode(pt)); return; }
      var val = done && S.cpVals[sn.id] ? S.cpVals[sn.id][bi] : '';
      var el;
      if (pt.type === 'choice') {
        el = h('select', { class:'inp', disabled: done }, h('option', { value:'' }, '— 선택 —'));
        pt.opts.forEach(function(o){ el.appendChild(h('option', { value:o, selected: val === o }, o)); });
      } else {
        el = h('input', { class:'inp', placeholder: pt.ph || '', value: val || '', disabled: done, style:'width:' + (pt.w || 9) + 'em', autocomplete:'off' });
        el.addEventListener('keydown', function(e){ if (e.key === 'Enter') check(); });
      }
      inputs.push({ el: el, pt: pt }); bi++;
      sent.appendChild(el);
    });
    var fb = h('div', { class:'cp-fb' + (done ? ' good' : '') }, done ? '✔ 정답' : '');
    var btn = h('button', { class:'btn pri', disabled: done }, '확인');

      if (btn.disabled) return;
      var ok = 0, vals = [];
      inputs.forEach(function(x){ var v = x.el.value; vals.push(v); if (v && x.pt.ans.indexOf(H(v)) >= 0) ok++; });

        afterCP(ch); renderCP(W);

        fb.className = 'cp-fb bad'; fb.textContent = inputs.length + '칸 중 ' + ok + '칸 정답'; sfx('bad');
        btn.disabled = true; setTimeout(function(){ btn.disabled = false; }, 2500);

    box.appendChild(sent);
  });

  W.body.appendChild(box);
}

function spawnDM(W, c, progress){

function phoneKey(W, k){
  var st = W.st; sfx('key');
  if (st.scr === 'lock') {
    if (/^\d$/.test(k) && st.buf.length < 4) { st.buf += k; st.msg = ''; }
    else if (k === '#' || k === 'back') st.buf = st.buf.slice(0, -1);
    else if (k === 'ok') {
      if (H(st.buf) === D.phone.lock) { S.flags.phone_open = true; st.scr = 'menu'; st.sel = 0; sfx('good'); fx(D.phone.fx); save(); }
      else { st.msg = '비밀번호가 다릅니다'; st.buf = ''; sfx('bad'); }
    }
  } else if (st.scr === 'menu') {
    var n = phoneBoxes().length + 1;
    if (k === 'up') st.sel = (st.sel + n - 1) % n;
    else if (k === 'down') st.sel = (st.sel + 1) % n;
    else if (/^[1-9]$/.test(k) && +k <= n) { st.sel = +k - 1; k = 'ok'; }
    if (k === 'ok') {
      if (st.sel < n - 1) { st.box = phoneBoxes()[st.sel].id; st.scr = 'list'; st.sel = 0; }
      else { st.scr = 'practice'; st.mt = { txt: '', k: null, i: 0, tm: 0 }; }
    }
  } else if (st.scr === 'list') {
    var ms = phoneMails(st.box);
    if (k === 'up') st.sel = Math.max(0, st.sel - 1);
    else if (k === 'down') st.sel = Math.min(ms.length - 1, st.sel + 1);
    else if (k === 'back') { st.scr = 'menu'; st.sel = 0; }
    else if (k === 'ok' && ms[st.sel]) { st.mid = ms[st.sel].id; st.scr = 'view'; st.scroll = 0; st.lsel = st.sel; fx(ms[st.sel].fx); }
  } else if (st.scr === 'view') {
    if (k === 'back') { st.scr = 'list'; st.sel = st.lsel || 0; }
    else if (k === 'down') st.scroll = (st.scroll || 0) + 60;
    else if (k === 'up') st.scroll = Math.max(0, (st.scroll || 0) - 60);
  } else if (st.scr === 'practice') {
    var mt = st.mt, now = Date.now();
    if (k === 'back') { st.scr = 'menu'; st.sel = phoneBoxes().length; }
    else if (k === '*') { mt.txt = ''; mt.k = null; }
    else if (k === '#') { mt.txt = mt.txt.slice(0, -1); mt.k = null; }
    else if (KEYS[k]) {
      var L = KEYS[k];
      if (mt.k === k && now - mt.tm < 1000 && k !== '0') { mt.i = (mt.i + 1) % L.length; mt.txt = mt.txt.slice(0, -1) + L[mt.i]; }
      else { mt.i = 0; mt.txt += L[0]; }
      mt.k = k; mt.tm = now;
    }
  }
  renderPhone(W);
}

function copyText(txt, fb){
  function ok(){ fb.textContent = '클립보드에 복사했습니다.'; }
  function fallback(){
    var ta = h('textarea', { style:'position:fixed;left:-9999px' }); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch (e) { fb.textContent = txt; } ta.remove();
  }
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback(); } catch (e) { fallback(); }
}

function startGame(fresh){

  var st = $('#sticky');
  if (D.desktop && D.desktop.sticky) { $('#sticky-text').innerHTML = D.desktop.sticky; st.classList.remove('hidden'); }

  if (fresh) startChapter(0);

   "body": "◆K3nGai 님.\n\n받았어요. 오카베 씨와 함께 경찰서에 다녀왔어요.\n유키 언니는 한참 아무 말 없이 울다가, 웃었어요.\n\n이제 마지막으로 한 가지만 해 줘요.\n아버지 이름을 검색해 줘요. 붙여서, 한 단어로.\n\n그동안은 아무것도 안 나오게 해 달라고 내가 부탁했었어요. 거기 나오는 건 전부 「살인자」라는 말뿐이었으니까.\n오늘부터는 하나가 나올 거예요.\n\n— 도리이 사키\n(이 계정은 이제 언니에게 돌려줄게요)"
  }
 ],

    "text": "<p>◆K3nGai 님, <b>트립 키<\/b>를 입력하세요.<\/p><p class=\"small\">2015년부터 과거 로그 창고는 트립 로그인 회원만 열람할 수 있습니다.<br>트립 키를 잊으셨다면, 처음 등록할 때 남긴 메모를 찾아보세요.<\/p>",

     "body": "◆K3nGai 님.\n\n이 주소로 메일을 받는 건 17년 만이지?\n2009년 여름, 당신은 누군가를 「특정」했어.\n그런데 그 특정은 아직 안 끝났어.\n\n사진을 한 장 보낼게.\n검색해 봐. 아마 아무것도 안 나올 거야.\n이 마을은, 그리고 이 사람은, 검색되지 않으니까.\n\n— 유메링",

     "body": "맞아. 2009년 8월 15일, 히나고 마을.\n\n다음은 당신이 제일 잘 아는 곳이야.\n나나채널 과거 로그 창고. 당신의 트립으로 로그인해.\n\n트립 키? 그 노트북 화면에 붙여 둔 메모, 아직 있잖아.\n\n— 유메링"

     "title": "인기 인터넷 방송인 19세 여성, 폐촌 탐방 생방송 중 연락 끊겨",
     "url": "hidanichi.jp/news/2009/08/17/0412",
     "date": "2009년(헤이세이 21년) 8월 17일",
     "byline": "사회부",
     "snippet": "15일 오후 8시께부터 기후현 다카야마시 미즈하초의 옛 히나고 마을에서 생방송을 하던 아시다 유메 씨(19)가…",
     "fx": {
      "timeline": [
       "t0_bstart",
       "t0_bend",
       "t0_search"
      ]
     },
     "body": "<p>15일 오후 8시께부터 기후현 다카야마시 미즈하초의 옛 히나고 마을에서 동영상 사이트 「밀밀동화」로 생방송을 하던 나고야시의 아시다 유메 씨(19)가 방송 도중 연락이 끊겼다. 다카야마 경찰서와 소방은 16일 아침부터 옛 마을 일대와 미즈하 댐 호수 주변을 수색하고 있다.<\/p><p>아시다 씨는 「유메링」이라는 이름으로 활동하는 인기 생방송 주로, 이날은 오봉 연휴를 맞아 「지도에서 사라진 마을 탐방」 방송을 예고했었다. 방송은 약 47분 만에 화면이 꺼진 채 끝났으며, 끝 무렵 아시다 씨는 「여기 전파가 안 터지는데…… 누가 댓글을 달고 있어」라고 말한 것으로 알려졌다.<\/p><p>옛 히나고 마을은 1998년 미즈하 댐 완공과 함께 주민 전원이 이주한 폐촌으로, 휴대전화가 거의 터지지 않는다. 경찰은 「야간 산길에서 발을 헛디뎠을 가능성」 등을 염두에 두고 있다.<\/p><p>다카야마서 관계자는 「옛 마을 주변의 인가는 마을 입구의 민박 한 곳뿐이다. 목격 정보를 기다린다」고 밝혔다.<\/p><blockquote><b>[추가 · 8월 19일]<\/b> 인터넷 익명 게시판에서는 18일부터 특정 인물을 「범인」으로 지목하는 글이 퍼지고 있다. 경찰은 「근거 없는 정보로 특정인을 비방하지 말아 달라」고 당부했다.<\/blockquote><p class=\"small muted\">관련 기사: [[page:p0_news_end|수색 종료 (8월 22일)]] · [[page:p0_hidanichi|히다 일일신문 2009년 8월 기사 목록]]<\/p>",

     "body": "<p><b>유메링 실종 사건<\/b>은 2009년(헤이세이 21년) 8월 15일, 동영상 사이트 밀밀동화의 생방송 주 「유메링」(본명 아시다 유메, 당시 19세)이 기후현의 폐촌 [[page:p0_wiki_hinago|히나고 마을]]에서 방송 도중 행방불명된 사건이다.<\/p><h2>경위<\/h2><ul><li>20:00 방송 시작. 장소는 「비밀」이라고 밝혔으나, 화면에 전봇대 주소판이 비쳤다.<\/li><li>20:12 무렵 「여기 전파 안 터지네」라고 말했다.<\/li><li>20:28 무렵부터 「마을 사람」이라는 회원이 댓글을 달기 시작했다.<\/li><li>20:44 무렵 「여기 전파가 안 터지는데…… 누가 댓글을 달고 있어」라는 말을 마지막으로 화면이 꺼졌다.<\/li><li>16일 아침부터 경찰과 소방이 수색했다.<\/li><\/ul><h2>인터넷의 반응<\/h2><p>8월 18일, 익명 게시판 나나채널의 이른바 [[page:p0_wiki_tokutei|특정반]]이 마을 입구에서 민박을 하던 남성(당시 47세)을 범인으로 지목했다. 이튿날에는 남성의 실명, 주소, 전화번호, 가족 구성까지 담긴 「정리 글」이 퍼졌고, 민박에는 장난 전화와 낙서, 숙박 후기 사이트의 별점 테러가 이어졌다. 민박은 9월에 문을 닫았다.<\/p><p class=\"small muted\">※ 이 문서는 개인정보 보호를 위해 민박 주인의 이름을 싣지 않는다.<\/p><h2>수사 결과<\/h2><p>8월 22일 경찰은 「조난 가능성이 높다」며 수색을 종료했다. 남성이 사건에 관여했다는 증거는 발표되지 않았다.<\/p><h2>평가<\/h2><p>근거가 부족한 상태에서 일반인을 「특정」해 생활을 무너뜨린 사례로, 특정반 문화에 대한 비판에서 자주 언급된다.<\/p>",

     "body": "<p><b>특정반<\/b>(신상추적단)은 익명 게시판에서 사진, 영상, 글 속의 단서를 모아 사람의 신원이나 사는 곳을 밝혀내는(「특정」하는) 자발적 집단을 말한다.<\/p><h2>수법<\/h2><p>사진 속 전봇대 주소판, 지역 한정 자판기 음료, 간판 글자, 창문이나 유리에 비친 모습, 열차 시간표, 우편번호 등을 조합한다.<\/p><h2>용어<\/h2><ul><li><b>정리 글<\/b> — 모은 정보를 한 레스에 정리한 글.<\/li><li><b>아카이브<\/b> — 지워지기 전에 떠 둔 페이지 보관본.<\/li><li><b>트립<\/b> — 고정 서명. 유명한 특정반원은 트립으로 알려졌다.<\/li><li><b>불타오름(여론 폭격)<\/b> — 특정된 사람에게 비난이 쏟아지는 일.<\/li><\/ul><h2>문제점<\/h2><p>엉뚱한 사람을 특정하는 「오인 특정」이 끊이지 않는다. 대표 사례로 2009년 [[page:p0_wiki_case|유메링 실종 사건]]이 있다. 이 사건에서 특정반은 <b>8월 18일<\/b> 처음으로 민박 주인을 지목했고, 19일 정리 글이 퍼졌다.<\/p>",

     "body": "로그인했구나.\n\n거기 있는 스레드들, 네가 다 세운 건 아니지만 네가 키운 스레드들이야.\n\n하나만 찾아 줘.\n그 사람의 이름을 「처음」 꺼낸 게 누구였는지.\n\n너는 아니었어. 그건 알아.\n네가 한 건 그다음 일이었지.\n\n— 유메링"

     "body": "그래. Xa9fQ2.\n이름 없이 불을 붙이고, 다른 게시판에 가서 바람을 불어 넣은 사람.\n\n그런데 그 사람이 노린 건 정말 「민박 주인」이었을까?\n\n다음은 그날 밤의 방송이야.\n네 노트북에 아직 있지? 네가 떠 둔 녹화 파일.\n\n— 유메링"

     "snippet": "10년 전 오늘 밤, 나는 실황 스레드를 세우고 있었다.",

     "body": "<p>10년 전 오늘 밤, 나는 나나채널에 실황 스레드를 세우고 있었다. 「유메링 오봉 특집 폐촌 탐방 실황」. 시작 8분 전에 스레드를 세우고, 방송 내내 화면을 중계했다. 「장소 비밀이라며 다 보여 주네요ㅋㅋ 다들 특정 금지예요~」라고 웃으면서.<\/p><p>그리고 방송이 끝나고 사흘 뒤, 「특정 금지」라고 쓰던 그 게시판에서 한 사람의 이름과 전화번호와 가족 구성이 정리되어 올라왔다. 나는 말리는 척했지만 끝까지 그 스레드를 떠나지 않았다.<\/p><p>나는 그 사람의 이름을 여기에 쓰지 않는다. 지금 그 이름을 검색하면 아무것도 나오지 않는다. 그게 그 가족이 겨우 얻어 낸 것이니까.<\/p><p>다음 글에서는 그 스레드의 ID들에 대해 쓰려고 한다.<\/p>",
     "keys": [
      "18l4v5amvpt"
     ]

     "snippet": "그 사람의 이름을 처음 꺼낸 것은 트립이 없는 ID였다.",

     "body": "<p>2009년 8월 18일 낮 12시 14분. 특정반 Part3에서 민박 주인의 이름을 처음 꺼낸 것은 트립이 없는 ID, <b>Xa9fQ2<\/b>였다.<\/p><p>그 무렵 나는 오컬트 게시판의 히나고 스레드도 보고 있었다. 26분 뒤, 그곳에 짧은 글이 올라왔다가 금방 지워졌다. 「민박 아저씨가 수상하다고 써 둬.」 다른 게시판에 가서 사람들에게 할 말을 정해 주는 글. 나는 그 ID를 봤고, 같은 ID였다. 그날 밤 9시 50분에는 같은 ID로 「목격담」이 올라왔다. 출처는 「아는 사람」.<\/p><p>나나채널의 ID는 하루 동안 사이트 전체에서 같다. 트립은 영원히 같다. 그 두 가지를 함께 보면 많은 것이 보인다. 그날 밤 9시 55분, 같은 ID에 트립이 달린 레스가 하나 있었다. 「나도 그렇게 생각해」.<\/p><p>나는 이것을 2009년 8월 23일 블로그에 썼다. 그리고 몇 시간 뒤 지웠다. 무서웠다. 그때 지운 글의 주소는 아직 외우고 있다.<\/p><blockquote>haruka-toshiden.petit-blog.jp/entry/20090823<\/blockquote><p>다시 열어 볼 용기는, 아직 없다.<\/p>",
     "keys": [

     ]

    {
     "id": "p1_haruka_post3",
     "type": "blog",
     "site": "늦은 정정",
     "siteSub": "2009년의 나에게 — 기타무라 하루카",

     "url": "late-teisei.noteblog.jp/entry/2021/03/20",
     "date": "2021/03/20",
     "snippet": "이 편지는 부치지 못한다.",
     "body": "<p>이 편지는 부치지 못한다. 받을 사람이 이제 없기 때문이다. 나는 그 사실을 6년이나 늦게 알았다.<\/p><p>당신의 딸이 정리 블로그에 남긴 댓글을, 나는 지워지기 전에 봤다. 「아빠는 언니를 역까지 데려다준 것뿐이에요.」 그 문장을 읽은 사람은 많았다. 다들 「자작」이라고 웃었다. 나도 웃지는 않았지만, 아무 말도 하지 않았다.<\/p><p>언니. 그 아이는 「언니」라고 썼다. 그때 누군가 한 명이라도 그 단어를 진지하게 읽었다면.<\/p><p>그 정리 블로그의 글은 지금도 남아 있다. 지워진 것은 그 댓글 하나뿐이다.<\/p>",
     "keys": [

     ]

     "body": "<div class=\"post\"><b>특정반을 그만두겠습니다<\/b> <span class=\"small\">2009/08/23 03:10<\/span><br><br>사흘 전, 특정반에서 함께 활동하던 <b>◆Hina<\/b> 님에게 개인 쪽지를 받았습니다.<br>「실황 스레 쪽에서도 민박 주인 이야기를 띄워 줘. 하루카 씨가 말하면 다들 믿으니까.」<br><br>저는 거절하지 못했습니다. 실황 스레드에서 「민박 쪽도 조사는 해 봐야겠죠」라고 한 줄 썼습니다. 그 한 줄이 어떻게 쓰였는지 저는 압니다.<br><br>어제, 민박집 딸이 정리 블로그에 남긴 댓글을 봤습니다. 「아빠는 언니를 역까지 데려다준 것뿐이에요.」<br>그리고 오컬트판에서 지워진 글을 기억합니다. 「민박 아저씨가 수상하다고 써 둬.」 그 ID는 ◆Hina 님이 「나도 그렇게 생각해」라고 쓴 ID와 같았습니다.<br><br>저는 특정반을 그만두겠습니다. 그리고 이 글도 아마 곧 지울 겁니다. 무서우니까요.<\/div>",

     "info": "<b>녹화 보관본<\/b> · 원본: 유메링의 밀밀 생방송 (2009/08/15 20:00 시작)<br>녹화: <b>◆K3nGai<\/b> — 녹화 도구 「밀밀 세이버」로 댓글까지 저장 · 파일명 유메링_0815.flv<br>채널: 유메링의 꿈방송 · 커뮤니티 <b>co20721<\/b> (현재 폐쇄)<br>방송 소개: 「오봉 특집! 엄마 고향 근처, 지도에서 사라진 마을을 걸어 봅니다♪ 장소는 비밀!」<br><span class=\"small\" style=\"color:#999\">화면을 누르면 지금 장면을 사진처럼 확대해 볼 수 있습니다. 댓글 목록의 회원 이름을 누르면 프로필이 보입니다.<\/span>",
     "segments": [

       "to": "03:00",
       "scene": "sc_v_entrance",
       "desc": "해질녘, 댐 호수가 내려다보이는 마을 입구. 꽃 머리핀을 한 유메링이 카메라를 향해 손을 흔든다. 「안녕~ 유메링이야! 오늘은 오봉 특집, 지도에서 사라진 마을에 왔어!」 화면 가장자리로 셔터가 내려진 작은 건물의 간판이 스쳐 지나간다."
      },
      {

       "to": "06:30",

       "scene": "sc_v_phone",

       "scene": "sc_v_shrine",
       "desc": "작은 신사와 지장당. 길가에 녹슨 자판기 한 대가 서 있다. 15:20 무렵 자판기 견본 칸이 잠깐 비친다. 「이 자판기 아직 살아 있어! 이 동네에서만 파는 사이다래.」"

       "to": "29:40",

       "desc": "20:00 위 마을 공민관(마을 회관) 도착. 미닫이문을 열고 들어간다. 벽에는 「히나고 유선방송」이라고 적힌 낡은 스피커, 한쪽 벽에는 번호가 붙은 사물함이 줄지어 있다. 유메링이 구석 책상의 낡은 컴퓨터와 작은 상자 같은 기계에 무언가를 꽂는다. 「짠, 비밀 무기~」 이때부터 화질이 눈에 띄게 좋아진다."

     "body": "<div class=\"nl-head\"><b>히나고 소식<\/b>제212호 · 헤이세이 9년 6월 1일 · 히나고 자치회 발행<\/div><div class=\"nl-col\"><div class=\"nl-box\"><b>◆ 공민관에 「ISDN 회선」 개통!<\/b><br>5월 20일, 공민관에 새 전화 회선(ISDN)이 들어왔습니다. 마을 최초의 「인터넷」입니다. 매주 토요일 오후 2시 「인터넷 체험 교실」을 엽니다. 컴퓨터는 공민관 구석 책상에 있습니다. 회선 상자(터미널 어댑터)는 함부로 뽑지 마세요.<\/div><div class=\"nl-box\"><b>◆ 유선방송 스피커 교체<\/b><br>각 집과 공민관의 「히나고 유선방송」 스피커를 새것으로 바꿉니다. 마을 방송과 유선 전화는 그대로 쓸 수 있습니다.<\/div><div class=\"nl-box\"><b>◆ 공민관 사물함 배정<\/b><br>공민관 사물함(801~830번)을 아래와 같이 배정합니다. 다이얼 자물쇠는 각자 준비해 주세요.<br>801 자치회 · 802 부인회 · 803 청년단 · … · 812 소방단 · … · <b>815 도리이(향우회 총무)<\/b> · … · 830 예비<\/div><div class=\"nl-box\"><b>◆ 이주 설명회<\/b><br>미즈하 댐 이주 설명회를 7월 6일 공민관에서 엽니다. 이주 후에도 「히나고 향우회」를 이어 갑니다. 공민관 회선은 이주 뒤에도 <b>향우회 연락용으로 남겨 둘 예정<\/b>입니다(담당: 도리이 마코토).<\/div><div class=\"nl-box\"><b>◆ 알림<\/b><br>장마철 산사태 주의. 지장당 청소 당번은 6반입니다.<\/div><\/div>",

     "snippet": "전화선을 디지털로 쓰는 통신 회선. 1990년대에 인터넷 접속용으로 널리 쓰였다.",
     "body": "<p><b>ISDN<\/b>은 일반 전화선을 디지털 방식으로 쓰는 통신 회선이다. 1990년대 후반 인터넷 접속용으로 널리 쓰였으며, 최대 64kbps(두 회선을 묶으면 128kbps)의 속도를 냈다.<\/p><h2>특징<\/h2><ul><li><b>전화선(유선)<\/b>을 쓰므로 휴대전화 전파와는 아무 상관이 없다. 휴대폰이 「권외」인 산골에서도 회선만 살아 있으면 접속할 수 있다.<\/li><li>컴퓨터와 회선 사이에 「터미널 어댑터(TA)」라는 작은 상자를 연결한다.<\/li><li>저화질 영상 통화나 영상 송출도 가능했다.<\/li><\/ul><h2>보급<\/h2><p>1990년대 후반 산간 마을의 공민관이나 학교에 「인터넷 체험」용으로 설치되기도 했다. 이용자가 줄면서 2024년 신규 접수가 끝났다.<\/p>",

     "body": "<p>미즈하 댐 위쪽, 1998년에 주민이 모두 떠난 위 마을의 공민관을 찾았다. 마을 입구의 민박은 오래전에 문을 닫은 듯했다.<\/p>[[photo:sc_urbex_hall|공민관 외관. 미닫이문은 잠겨 있지 않았다.]]<p>안은 의외로 깨끗했다. 벽에는 「히나고 유선방송」 스피커. 구석 책상에는 오래된 컴퓨터와 작은 회선 상자가 있었다. 상자에는 「공민관 회선 · 향우회」라는 스티커. 전원은 들어오지 않았다.<\/p>[[photo:sc_urbex_pc|구석 책상. 오래된 컴퓨터와 회선 상자(TA).]]<p>한쪽 벽에는 801번부터 830번까지 사물함이 늘어서 있었다. 대부분 비어 있고 문이 열려 있었는데, <b>딱 하나<\/b>에만 세 자리 다이얼 자물쇠가 걸려 있었다. 이름표는 바래서 거의 읽을 수 없었다.<\/p>[[photo:sc_urbex_lockers|사물함 벽. 자물쇠가 걸린 사물함은 하나뿐.]]<p>남의 것을 억지로 열 생각은 없다. 사진만 찍고 나왔다. 저 안에 무엇이 들어 있는지, 열쇠 번호를 아는 사람은 이 세상에 몇 명이나 될까.<\/p>",

     "body": "<div class=\"post\"><b>폴더폰 빨리 치기 강좌!!<\/b> <span class=\"small\">2009/02/14<\/span><br><br>방송에서 「유메링 문자 왜 이렇게 빨라?」라는 질문이 많아서 강좌를 열어 봅니다ㅋㅋ<br><br>폴더폰 숫자 키에는 글자가 적혀 있지? 2에는 ABC, 3에는 DEF, 4에는 GHI, 5에는 JKL, 6에는 MNO, 7에는 PQRS, 8에는 TUV, 9에는 WXYZ.<br><br><b>같은 키를 누른 횟수 = 몇 번째 글자<\/b>야!<br>2 한 번 → A / 22 → B / 222 → C<br>7777 → S (7은 네 글자라 네 번)<br>그리고 <b>0은 띄어쓰기<\/b>.<br><br>연습 문제 : <b>44 444<\/b> 는? → H I → 「HI」!<br>그럼 <b>999 88 6 33<\/b> 는? 정답은 다음 방송에서♪<br><br>친구들끼리 숫자만으로 비밀 문자 보내기 놀이도 재밌어요. 근데 너무 빠지면 숫자만 봐도 글자로 보이는 병에 걸림ㅋㅋ<\/div>",

     "url": "hidanichi.jp/feature/2025/03/30/okabe",
     "date": "2025년(레이와 7년) 3월 30일",
     "byline": "사람 이야기",
     "snippet": "38년 동안 히다의 산골을 지킨 순경이 이달 퇴직한다. 2009년 오봉의 수색을 지휘했던 사람이다.",
     "fx": {
      "cards": [
       "okabe"
      ],
      "timeline": [
       "t2_okabe"
      ]
     },
     "body": "<p>38년 동안 히다의 산골을 지킨 오카베 다쓰오 순경(58)이 이달 퇴직한다. 그는 2009년 오봉, 옛 히나고 마을에서 생방송 도중 연락이 끊긴 19세 여성의 수색을 지휘했던 사람이다.<\/p><p>— 그날 밤은 어디에 계셨습니까.<\/p><p>「다카야마 시내 오봉 축제 경비를 서고 있었습니다. 등불 행렬을 지키다가, 다음 날 아침 일찍 수색에 불려 갔지요.」<\/p><p>— 현장은 어땠습니까.<\/p><p>「마을 입구의 민박에는 열두 살 딸아이가 혼자 아버지를 기다리고 있었습니다. 아버지는 밤늦게 돌아왔다고 했어요. 그 아이 얼굴을 잊을 수가 없습니다.」<\/p><p>— 방송 속 「마을 사람」 댓글은 지금도 수수께끼로 남아 있습니다.<\/p><p>「위 마을 공민관에 옛 전화 회선이 살아 있었다는 건 나중에 알았습니다. 그날 밤 그 회선으로 접속한 기록이 있었지요. 유령이 아니었습니다.」<\/p><p>— 수색은 일주일 만에 「조난 추정」으로 끝났습니다.<\/p><p>「그렇게 끝낼 수밖에 없는 사정이 있었습니다. 일반론으로만 말씀드리겠습니다. 성인이 스스로 떠났고, 누군가에게 쫓기고 있다면 — 경찰은 그 사람이 어디 있는지 누구에게도 말해서는 안 됩니다. 가족에게도, 기자에게도, 인터넷에도요.」<\/p><p>— 그 사이 인터넷에서는 민박 주인이 범인으로 몰렸습니다.<\/p><p>「…그분은 2015년에 돌아가셨다고 들었습니다. 끝내 한마디도 하지 않으셨지요. 저도 마찬가지였습니다. 그게 제 일이었으니까요. 그날 밤 10시 반쯤 그 아이의 커뮤니티에 짧은 공지가 올라왔다가 곧 지워졌다는 이야기를 나중에 들었습니다. 그걸 본 사람이 몇이나 있었을까요.」<\/p><p>퇴직 후에는 텃밭에 사과나무를 심을 생각이라고 했다.<\/p>",

     "body": "<p>오늘 아침, 아버지가 떠났다. 1년 동안의 투병이었다. 쉰셋.<\/p><p>아버지는 끝까지 아무 말도 하지 않았다. 2009년 여름에 무슨 일이 있었는지, 왜 그 많은 전화와 낙서를 견디면서도 한마디도 하지 않았는지. 병원 침대에서 내가 물어도 아버지는 웃기만 했다.<\/p><p>민박을 닫은 뒤 아버지는 기후 시내의 공장에서 일했다. 사과 조림은 더 이상 만들지 않았다.<\/p><p>아버지의 이름을 검색하면 아직도 무서운 말들이 나온다. 그 말들을 지워 달라고, 검색 회사에 편지를 쓰기로 했다.<\/p>",

     "body": "<p>2009년 오봉. 나는 열두 살이었다.<\/p><p>그해 여름, 나고야에 사는 <b>사촌 언니<\/b>가 우리 민박에 왔다. 고모의 딸. 언니는 우리 아빠를 「삼촌」이라고 불렀다. 언니는 늘 웃었지만, 가끔 휴대폰을 보다가 얼굴이 하얘졌다. 누군가 언니를 쫓아다닌다고 했다. 숫자만 적힌 메일이 온다고 했다.<\/p><p>15일 밤, 언니는 위 마을 공민관에서 방송을 했다. 방송이 끝나고 아빠는 「집 좀 지키고 있어」라고 하고 차를 몰고 나갔다. 언니를 태우고. 나는 현관에 앉아서 기다리다 잠들었다. 아빠는 자정이 넘어서 돌아왔다. 아무 말 없이 내 머리를 쓰다듬었다.<\/p><p>사흘 뒤부터 전화가 울리기 시작했다. 나는 그때 처음 「살인자의 딸」이라는 말을 들었다.<\/p><p>아빠는 경찰에 「그날 밤 민박에 있었다」고 했다. 거짓말이었다. 언니가 어디로 갔는지 말하지 않기 위한 거짓말. 나는 그 거짓말을 지키는 역할이었다.<\/p>",

     "title": "17년 만의 정정 — 「히나고 민박 주인은 무고했다」",

     "date": "2026년(레이와 8년) 11월 29일",
     "snippet": "2009년 유메링 실종 사건 때 인터넷에서 「범인」으로 지목된 도리이 마코토 씨(2015년 별세)가 사건과 무관했다는 사실이 확인되었다.",

      ]
     },
     "body": "<p>2009년 오봉, 옛 히나고 마을에서 생방송 도중 연락이 끊긴 이른바 「유메링 실종 사건」 당시 인터넷 익명 게시판에서 「범인」으로 지목되었던 민박 주인 <b>도리이 마코토<\/b> 씨(2015년 별세, 당시 53세)가 사건과 무관했다는 사실이 확인되었다.<\/p><p>경찰에 따르면 실종된 것으로 알려졌던 여성은 2009년 당시 스토킹 피해를 피해 스스로 거처를 옮겼으며, 본인의 요청에 따라 소재가 공개되지 않았다. 여성은 현재 다른 이름으로 안전하게 생활하고 있다. 도리이 씨는 여성의 외삼촌으로, 그날 밤 여성을 다카야마역의 막차까지 데려다주었을 뿐이었다.<\/p><p>이번 사실은 2009년 당시 도리이 씨의 신상 정보를 게시판에 올렸던 한 인터넷 이용자가 17년 만에 정정 글을 쓰고, 보관해 온 증거를 경찰과 유족에게 전달하면서 알려졌다. 그 이용자는 자신의 신원과 다른 사람의 이름을 밝히지 않았다.<\/p><p>경찰은 당시부터 여성을 쫓아다녀 온 30대 남성을 스토킹 혐의로 조사하고 있다. 남성은 최근까지도 여성의 현재 거처를 알아내 공개하겠다고 예고해 온 것으로 알려졌다.<\/p><p>2009년 수색을 지휘했던 오카베 다쓰오 전 순경(59)은 「17년 동안 말할 수 없었던 것을 이제야 말할 수 있게 되었다. 도리이 씨는 처음부터 끝까지 한 사람을 지킨 분이었다」고 말했다.<\/p><p>도리이 씨의 딸 사키 씨(29)는 「아버지의 이름을 검색하면, 이제 이 기사가 나왔으면 좋겠다」고 말했다.<\/p><p class=\"small muted\">— 검색 결과 1건 —<\/p>",
