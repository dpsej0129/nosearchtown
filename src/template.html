<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>권외 — 검색되지 않는 마을</title>
<meta name="description" content="가상 데스크톱에서 진행하는 검색·SNS 추리 어드벤처">
<style>
/*__STYLE__*/

<body>
<!-- ① HTML -->
<div id="title">
  <div class="t-box">
    <div class="t-signal">신호 없음 · 2026.11</div>
    <h1>권외<small>검색되지 않는 마을</small></h1>
    <div class="t-bars"><i></i><i></i><i></i><i></i><b>권외</b></div>
    <div class="t-menu">
      <button id="t-continue" class="hidden">이어하기</button>
      <button id="t-new">처음부터</button>
      <button id="t-delete" class="danger hidden">저장 데이터 삭제</button>
    </div>
    <div class="t-note">
      <b>이 게임은 개발자 도구나 소스 확인이 필요 없는 게임입니다.</b><br>
      모든 단서는 화면 안에 있습니다. 정답은 소스에 평문으로 들어 있지 않습니다.<br>
      검색창에는 <b>한 단어만</b> 입력할 수 있습니다. 인물 이름은 붙여 쓰세요.<br>
      진행 상황은 이 브라우저에 자동 저장됩니다. 플레이 시간 약 2~3시간.<br>
      <span style="color:#c98a95">실종, 스토킹, 인터넷 여론 폭력을 다룹니다. 살인·고어 묘사는 없습니다.<br>
      등장하는 인물, 단체, 사이트, 마을은 모두 가상입니다.</span>
    </div>
  </div>
</div>

<div id="desktop">
  <div id="icons"></div>
  <div id="sticky" class="hidden"><span class="pin"></span><div id="sticky-text"></div></div>
</div>

<div id="taskbar">
  <button id="tb-start" title="열린 창 모두 최소화">◆</button>
  <div id="tb-wins"></div>
  <div id="tb-tray">
    <button id="tb-found" title="지금까지 연 페이지 목록">발견 페이지 0/0</button>
    <button id="tb-sound" title="소리 켜기/끄기">♪</button>
    <div id="tb-clock"></div>
  </div>
</div>

<div id="toasts"></div>
<div id="overlay"><div class="ov-in" id="overlay-in"></div></div>
<div id="ending" class="hidden"></div>

<!-- ② 엔진 JS -->

</html>
